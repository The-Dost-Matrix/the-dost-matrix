# Draait automatisch bij elke pull request naar main, nog vóórdat iemand
# (of de QA-rol van Mission Engine V2) er inhoudelijk naar hoeft te kijken.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-checks:
    name: Typecheck & import-check
    runs-on: ubuntu-latest

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: TypeScript-controle (tsc --noEmit)
        run: npm run typecheck

      - name: Import-controle (ontbrekende lokale imports)
        run: npm run verify-imports

      - name: Tests uitvoeren (vitest)
        run: npm run test

      # Toegevoegd op 20 september 2026 naar aanleiding van bevinding F-04 uit
      # de externe review: typecheck en unittests tonen niet aan dat Next.js de
      # productie-app daadwerkelijk kan bouwen. Een fout in een server
      # component, een verkeerde import in een route of een kapotte
      # build-configuratie komt pas hier aan het licht — en juist die fouten
      # blokkeren het uitrollen naar Vercel.
      #
      # De variabelen hieronder zijn opzettelijk nepwaarden. De build heeft ze
      # nodig om te kunnen starten, niet om ergens verbinding mee te maken;
      # er gaan bewust GEEN productiegeheimen naar CI.
      - name: Productiebuild (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"