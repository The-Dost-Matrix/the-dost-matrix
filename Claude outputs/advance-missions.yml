name: Autonome missie-voortgang

# Roadmap-stap 15 (deel 2): roept periodiek de /api/missions/v2/advance-route
# aan op de gehoste Matrix (Vercel), zodat ACTIVE/WAITING_FOR_ROLE-missies
# ook zonder dat Elroy is ingelogd doorlopen — bijvoorbeeld 's nachts.
#
# Gekozen boven Vercel's ingebouwde cron omdat die op het gratis Hobby-plan
# maar één keer per dag draait (met tot 59 minuten afwijking) — veel te grof
# om een missie in meerdere stappen te laten voortgaan. GitHub Actions'
# schedule-trigger is een "best effort"-timer: GitHub geeft zelf aan dat een
# geplande run bij drukte vertraagd kan worden, en schakelt een schedule
# automatisch uit als de repository 60 dagen zonder enige activiteit blijft
# (een gewone commit of push zet 'm dan weer aan) — voor deze use-case
# (elke ~10 minuten, actief project) is dat geen praktisch probleem.
on:
  schedule:
    - cron: "*/10 * * * *"
  # Handmatig te starten via de "Run workflow"-knop op GitHub, handig om de
  # koppeling na het instellen meteen te testen zonder tot de volgende
  # geplande run te hoeven wachten.
  workflow_dispatch:

# Toegevoegd op 20 september 2026 naar aanleiding van bevinding F-06 uit de
# externe review. Een geplande run kan tot 300 seconden lopen (de wachtlus op
# CI zit daarin), en de handmatige "Run workflow"-knop kan er dwars doorheen
# starten. Twee gelijktijdige aanroepen zouden dezelfde missie kunnen oppakken:
# de Firestore-versiecontrole laat de tweede dan wel falen, maar pas NA de
# LLM-aanroep en een mogelijke commit naar GitHub — dus na de bijwerking, niet
# ervoor. Deze groep laat een tweede run wachten in plaats van meelopen.
#
# cancel-in-progress staat bewust op false: een lopende missiestap afbreken is
# erger dan een tik overslaan, want de volgende tik komt binnen tien minuten
# toch weer langs.
concurrency:
  group: advance-missions
  cancel-in-progress: false

jobs:
  advance-missions:
    runs-on: ubuntu-latest
    steps:
      - name: Roep de advance-route van de Matrix aan
        run: |
          curl \
            --fail-with-body \
            --max-time 290 \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.MISSION_ADVANCE_SECRET }}" \
            --header "Content-Type: application/json" \
            "https://the-dost-matrix.vercel.app/api/missions/v2/advance"